line-length = 120
target-version = "py312"

exclude = [
    ".venv",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names)
    "I",   # import sorting
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (common bug patterns)
]
ignore = [
    "E501",  # line length — enforced via line-length above, not as a hard error
]

[lint.per-file-ignores]
# paper_trader.py deliberately inserts the project root onto sys.path before
# importing root-level sibling modules — see its top-of-file comment.
"paper_trading/paper_trader.py" = ["E402"]
# web_dashboard.py does the same for its sibling dashboard.py import.
"paper_trading/web_dashboard.py" = ["E402"]
# live_trader.py does the same for the root-level modules it imports.
"live_trading/live_trader.py" = ["E402"]
# trend_paper_trader.py does the same for paper_trading/paper_trader.py and
# the root-level modules it reuses.
"experiments/trend_paper_trader.py" = ["E402"]
# gabagool_paper_trader.py does the same for the root-level
# btc_15m_market_finder.py/gabagool_strategy.py modules it imports.
"paper_trading/gabagool_paper_trader.py" = ["E402"]
