line-length = 120
target-version = "py312"

exclude = [
    ".venv",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names)
    "I",   # import sorting
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (common bug patterns)
]
ignore = [
    "E501",  # line length — enforced via line-length above, not as a hard error
]

[lint.per-file-ignores]
# Scripts in paper_trading/ insert the project root onto sys.path before
# importing root-level sibling modules — see their top-of-file comments.
"paper_trading/web_dashboard.py" = ["E402"]
# gabagool_paper_trader.py: the root-level
# btc_15m_market_finder.py/gabagool_strategy.py modules it imports.
"paper_trading/gabagool_paper_trader.py" = ["E402"]
# pair_cost_paper_trader.py does the same for btc_5m_market_finder.py/gabagool_strategy.py.
"paper_trading/pair_cost_paper_trader.py" = ["E402"]
# copy_paper_trader.py does the same for btc_5m_market_finder.py/gabagool_strategy.py.
"paper_trading/copy_paper_trader.py" = ["E402"]
"paper_trading/pair_cost_v2_paper_trader.py" = ["E402"]
